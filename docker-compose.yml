services:
  # Development-only stack. It deliberately publishes PostgreSQL and runs as
  # root to preserve bind-mount and named-volume ergonomics on local hosts.
  web:
    build: .
    user: "0:0"
    command: >
      sh -c "python manage.py migrate
      && python manage.py seed_catalogos
      && python manage.py runserver 0.0.0.0:8007"
    ports:
      - "8007:8007"
    environment:
      DJANGO_SECRET_KEY: dev-insecure-change-me
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,web
      POSTGRES_DB: scout_gestor
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/api/v1/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scout_gestor
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout_gestor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_data:
